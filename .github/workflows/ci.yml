name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  quality-gate:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Run golden dataset
        run: llm-eval run --gate -o reports/candidate

      - name: Compare against committed baseline
        run: >
          llm-eval compare baselines/baseline.json reports/candidate/results.json
          -o reports/compare --summary-md "$GITHUB_STEP_SUMMARY"

      # Guard the guard: a deliberately degraded candidate must be rejected (exit code 1).
      - name: Gate self-test
        run: |
          llm-eval run -c configs/candidate-degraded.yaml -o reports/degraded
          set +e
          llm-eval compare baselines/baseline.json reports/degraded/results.json -o reports/compare-degraded
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::Expected the gate to fail the degraded candidate with exit 1, got $code"
            exit 1
          fi
          echo "Gate correctly rejected the degraded candidate."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
