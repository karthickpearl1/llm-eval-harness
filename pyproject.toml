[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Evaluation and regression harness for LLM and RAG applications, with a CI quality gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karthick Sivagnanam" }]
requires-python = ">=3.11"
keywords = ["llm", "rag", "evaluation", "testing", "quality-engineering", "testops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
bedrock = ["boto3>=1.34"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=llm_eval --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["llm_eval"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.ruff.format]
quote-style = "double"
